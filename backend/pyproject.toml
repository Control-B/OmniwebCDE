[project]
name = "omniweb-cde-api"
version = "0.1.0"
description = "Omniweb CDE control-plane API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17.0",
  "cryptography>=46.0.3",
  "fastapi>=0.120.0",
  "httpx>=0.28.1",
  "langgraph>=1.2.0",
  "opentelemetry-api>=1.38.0",
  "opentelemetry-instrumentation-fastapi>=0.59b0",
  "openai>=2.54.0,<3",
  "prometheus-client>=0.23.1",
  "pydantic-settings>=2.11.0",
  "pyjwt[crypto]>=2.10.1",
  "redis>=7.0.1",
  "sqlalchemy[asyncio]>=2.0.44",
  "temporalio>=1.19.0",
  "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.14.3",
]
postgres = ["asyncpg>=0.30.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "E501", "S101"]

[tool.ruff.lint.per-file-ignores]
# Templates emit source code for generated apps; their strings are not executed as SQL here.
"app/builder/templates.py" = ["S608"]
"tests/*" = ["S603", "S607"]
