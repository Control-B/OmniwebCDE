#cloud-config
package_update: true
package_upgrade: false

users:
  - name: developer
    gecos: Omniweb Developer
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:/usr/bin/systemctl,/usr/bin/journalctl"]
    lock_passwd: true

ssh_pwauth: false
disable_root: true

packages:
  - ca-certificates
  - curl
  - git
  - jq
  - ripgrep
  - tmux
  - unzip
  - python3
  - python3-venv

write_files:
  - path: /etc/ssh/sshd_config.d/99-omniweb.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      AllowTcpForwarding no
  - path: /etc/systemd/system/omniweb-bootstrap.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Omniweb workspace bootstrap
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/omniweb-bootstrap
      RemainAfterExit=yes
      [Install]
      WantedBy=multi-user.target
  - path: /usr/local/sbin/omniweb-bootstrap
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      install -d -o developer -g developer -m 0750 /workspace/project
      install -d -o root -g root -m 0755 /etc/apt/keyrings
      curl --fail --silent --show-error --location https://download.docker.com/linux/ubuntu/gpg \
        | gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg
      . /etc/os-release
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" \
        > /etc/apt/sources.list.d/docker.list
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker

runcmd:
  - systemctl restart ssh
  - systemctl enable --now omniweb-bootstrap.service

mounts:
  - ["/dev/disk/by-id/scsi-0DO_Volume_omniweb-workspace", "/workspace", "ext4", "defaults,nofail,discard", "0", "2"]

final_message: "Omniweb base bootstrap completed after $UPTIME seconds"
