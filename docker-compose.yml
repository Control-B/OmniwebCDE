name: omniweb-cde

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: omniweb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: omniweb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniweb"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: omniweb
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.42.1
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-only}
    volumes:
      - ./infrastructure/identity/omniweb-realm.json:/opt/keycloak/data/import/omniweb-realm.json:ro

  coder:
    image: ghcr.io/coder/coder:2.37.7
    environment:
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:-http://coder.localhost}
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_PG_CONNECTION_URL: postgresql://omniweb:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/coder?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  api:
    build:
      context: ./backend
    environment:
      OMNIWEB_ENVIRONMENT: development
      OMNIWEB_DATABASE_URL: postgresql+asyncpg://omniweb:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/omniweb
      OMNIWEB_FRONTEND_ORIGIN: http://localhost:43210
      OMNIWEB_CODER_BASE_URL: http://coder:7080
      OMNIWEB_CODER_ACCESS_URL: http://coder.localhost
      OMNIWEB_MOCK_INFRASTRUCTURE: "true"
      OMNIWEB_MODEL_GATEWAY_URL: http://model-gateway:8020
      OMNIWEB_MODEL_GATEWAY_SECRET: ${MODEL_GATEWAY_SECRET:-local-development-gateway-secret-change-me}
      # Leave OMNIWEB_OIDC_ISSUER empty to use the local development identity. To sign in through
      # Keycloak, set it to http://localhost:8180/realms/omniweb (the issuer browsers see).
      OMNIWEB_OIDC_ISSUER: ${OMNIWEB_OIDC_ISSUER:-}
      OMNIWEB_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/omniweb
      OMNIWEB_BUILDER_DATA_DIR: /data
      OMNIWEB_PREVIEW_URL: http://localhost:43230
    volumes:
      - builder-data:/data
    # The namespace sandbox creates unprivileged user namespaces for generated-app builds. Docker's
    # default seccomp profile blocks that; use OMNIWEB_SANDBOX_MODE=container on a dedicated build
    # host instead of loosening the profile on a shared machine.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      model-gateway:
        condition: service_started

  preview:
    build:
      context: ./backend
    command: ["uvicorn", "app.preview_server:app", "--host", "0.0.0.0", "--port", "43230"]
    environment:
      OMNIWEB_ENVIRONMENT: development
      OMNIWEB_BUILDER_DATA_DIR: /data
      OMNIWEB_FRONTEND_ORIGIN: http://localhost:43210
    volumes:
      - builder-data:/data:ro
    ports:
      - "43230:43230"

  model-gateway:
    build:
      context: ./services/model-gateway
    environment:
      GATEWAY_ENVIRONMENT: development
      GATEWAY_DATABASE_URL: postgresql+asyncpg://omniweb:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/model_gateway
      GATEWAY_SERVICE_SECRET: ${MODEL_GATEWAY_SECRET:-local-development-gateway-secret-change-me}
      GATEWAY_ENCRYPTION_KEY: ${MODEL_GATEWAY_ENCRYPTION_KEY:-}
      GATEWAY_MOCK_MODE: "true"
      # Platform-managed provider keys. Leave empty to rely on customer keys or the development model.
      GATEWAY_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GATEWAY_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GATEWAY_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GATEWAY_XAI_API_KEY: ${XAI_API_KEY:-}
      GATEWAY_OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GATEWAY_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8010
        VITE_OIDC_ISSUER: ${OMNIWEB_OIDC_ISSUER:-}
    depends_on:
      - api

  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "${OMNIWEB_HTTP_PORT:-8088}:80"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  redis-data:
  builder-data:
