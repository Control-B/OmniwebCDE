[project]
name = "omniweb-model-gateway"
version = "0.1.0"
description = "Omniweb multi-provider model gateway: discovery, routing, budgets, and usage"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46.0.3",
  "fastapi>=0.120.0",
  "httpx>=0.28.1",
  "litellm>=1.80.0",
  "pydantic-settings>=2.11.0",
  "pyjwt>=2.10.1",
  "sqlalchemy[asyncio]>=2.0.44",
  "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.14.3",
]
postgres = ["asyncpg>=0.30.0"]

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "E501", "S101"]
