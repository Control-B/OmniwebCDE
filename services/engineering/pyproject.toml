[project]
name = "omniweb-engineering-service"
version = "0.1.0"
description = "Isolated deterministic CAD, drawing, export and geometry validation service"
requires-python = ">=3.12"
dependencies = [
  "cadquery>=2.8.0,<3",
  "ezdxf>=1.4.3,<2",
  "fastapi>=0.120.0",
  "pydantic>=2.12.0",
  "prometheus-client>=0.23.1",
  "reportlab>=4.4.4,<5",
  "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28.1", "pytest>=8.4.2", "ruff>=0.14.3"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engineering*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101"]
